[project]
name = "bbp-simulator"
version = "0.1.0"
description = "BBP device simulator (replay + response model)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
bbp-simulator = "bbp_simulator.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bbp_simulator*"]
